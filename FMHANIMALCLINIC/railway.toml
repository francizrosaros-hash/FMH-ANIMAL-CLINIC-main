[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"

[deploy]
startCommand = "gunicorn FMHANIMALCLINIC.wsgi --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT"
releaseCommand = "python manage.py migrate --noinput"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
